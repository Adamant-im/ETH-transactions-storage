name: Publish Docker image

# Runs when a GitHub Release is published (not on every push).
# The job is skipped unless the release tag points to a commit on master.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Serialize all publication. Both `v2.5.0` and `2.5.0` are accepted release
# tags and normalize to the same image tag, so a group keyed on the release tag
# would put two writers of one immutable version into different groups.
concurrency:
  group: publish-docker
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/adamant-im/eth-transactions-storage

jobs:
  docker:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify the release tag is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master

      - name: Resolve image tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$'; then
            echo "Release tag '${RELEASE_TAG}' is not a semantic version" >&2
            exit 1
          fi
          tags="${REGISTRY_IMAGE}:${version}"
          if [ "${IS_PRERELEASE}" = 'false' ]; then
            tags="${tags},${REGISTRY_IMAGE}:latest"
          else
            echo 'Prerelease: publishing the version tag only, leaving latest untouched'
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Version tags are immutable. A rerun would otherwise rebuild the same
      # release commit and replace the published digest, because the base image
      # and dependency constraints can resolve differently over time.
      #
      # The check distinguishes three outcomes. The tag is present: refuse. The
      # package has no versions yet: continue. Anything else, including auth,
      # rate-limit, network, and server errors: refuse, because an inconclusive
      # lookup must never authorize overwriting a published version.
      - name: Refuse to overwrite an already published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set +e
          tags="$(gh api --paginate \
            '/orgs/adamant-im/packages/container/eth-transactions-storage/versions' \
            --jq '.[].metadata.container.tags[]?' 2>&1)"
          lookup_status=$?
          set -e

          if [ "${lookup_status}" -ne 0 ]; then
            if printf '%s\n' "${tags}" | grep -q 'HTTP 404'; then
              echo "The package has no versions yet, this is its first publication"
              exit 0
            fi
            echo "::error::Could not determine whether ${REGISTRY_IMAGE}:${VERSION} is already published, so publication is refused. Lookup output: ${tags}"
            exit 1
          fi

          if printf '%s\n' "${tags}" | grep -Fxq "${VERSION}"; then
            echo "::error::${REGISTRY_IMAGE}:${VERSION} is already published. Version tags are immutable; publish a new version instead of re-running this workflow."
            exit 1
          fi

          echo "${REGISTRY_IMAGE}:${VERSION} is unpublished, continuing"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Verify the published manifest
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Smoke test the published image
        run: |
          set +e
          output="$(docker run --rm "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}" 2>&1)"
          exit_code=$?
          set -e
          echo "${output}"
          test "${exit_code}" -eq 2
          echo "${output}" | grep -q 'ETH_URL'
