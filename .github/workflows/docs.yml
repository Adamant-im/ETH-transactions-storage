name: Docs

# Builds the VitePress documentation site and deploys it to GitHub Pages at
# https://eth-indexer.docs.adamant.im
#
# Only trusted repository content is deployed: published releases, pushes to the
# default branch, and manual runs. Pull requests are validated by docs-build.yml
# and never reach the Pages environment.
#
# One-time repository prerequisites, all of which need repository admin rights:
#   1. Settings > Pages > Source: GitHub Actions
#   2. Settings > Pages > Custom domain: eth-indexer.docs.adamant.im, then
#      Enforce HTTPS once GitHub has provisioned the certificate
#   3. Settings > Environments > github-pages > Deployment branches and tags:
#      add a `v*` tag rule next to the master branch rule, or the release
#      trigger below is rejected because it deploys from refs/tags/vX.Y.Z
# The default GITHUB_TOKEN cannot perform any of these, so runs fail until
# they are done.

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build docs
        run: npm run docs:build

      # The artifact carries the domain for provenance and for a fallback to
      # branch-based publishing. It does NOT configure the Pages custom domain:
      # GitHub ignores an artifact CNAME for Actions-based deployments.
      - name: Verify the custom domain is part of the artifact
        run: |
          test -f docs/.vitepress/dist/CNAME
          grep -qx 'eth-indexer.docs.adamant.im' docs/.vitepress/dist/CNAME

      # Requires two one-time repository settings, because the default
      # GITHUB_TOKEN cannot create a Pages site or set a custom domain:
      #   Settings > Pages > Source: GitHub Actions
      #   Settings > Pages > Custom domain: eth-indexer.docs.adamant.im
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
