services:
  db:
    image: postgres:14
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}']
      interval: 5s
      timeout: 15s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    ports:
      - '3000:3000'
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app_db}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-web_anon}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-10000}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-http://127.0.0.1:3000}
    depends_on:
      - db

  # Optional local Geth dev node for testing. For production, point ETH_URL to your external Ethereum node.
  # Pinned to the stable release tag: latest tracks unstable development builds.
  publicnode:
    image: ethereum/client-go:stable
    ports:
      - '8545:8545'
      - '8546:8546'
    command: --dev --dev.period 3 --http --http.addr 0.0.0.0 --http.api web3,eth,net --http.vhosts '*' --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api web3,eth,net --datadir /tmp
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8545']
      interval: 5s
      timeout: 15s
      retries: 5

  # Indexer service. Uses the published image by default; override
  # ETH_INDEXER_IMAGE in .env to pin a version, or use docker-compose.build.yml
  # to build from this checkout.
  eth-storage:
    image: ${ETH_INDEXER_IMAGE:-ghcr.io/adamant-im/eth-transactions-storage:latest}
    environment:
      DB_NAME: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app_db}
      ETH_URL: ${DOCKER_ETH_URL:-ws://publicnode:8546}
      START_BLOCK: ${START_BLOCK:-1}
      CONFIRMATIONS_BLOCK: ${CONFIRMATIONS_BLOCK:-0}
      PERIOD: ${PERIOD:-20}
      LOG_FILE: ${LOG_FILE:-}
      ADDRESS_FILTER_ENABLED: ${ADDRESS_FILTER_ENABLED:-false}
      ADDRESS_FILTER_FILE: ${ADDRESS_FILTER_FILE:-filter/addresses.txt}
    volumes:
      - ./filter:/eth-storage/filter:ro
    depends_on:
      db:
        condition: service_healthy
      publicnode:
        condition: service_healthy
