services:
  db:
    image: postgres:14
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 15s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    ports:
      - '3000:3000'
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI}
    depends_on:
      - db

  # Optional local Geth dev node for testing. For production, point ETH_URL to your external Ethereum node.
  publicnode:
    image: ethereum/client-go:latest
    ports:
      - '8545:8545'
      - '8546:8546'
    command: --dev --dev.period 3 --http --http.addr 0.0.0.0 --http.api web3,eth,admin,personal,net --http.vhosts '*' --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api web3,eth,admin,personal,net --datadir /tmp --allow-insecure-unlock
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8545']
      interval: 5s
      timeout: 15s
      retries: 5

  eth-storage:
    build: .
    environment:
      DB_NAME: ${DB_NAME}
      ETH_URL: ${ETH_URL}
      START_BLOCK: ${START_BLOCK}
      CONFIRMATIONS_BLOCK: ${CONFIRMATIONS_BLOCK}
      PERIOD: ${PERIOD}
      LOG_FILE: ${LOG_FILE}
      ADDRESS_FILTER_ENABLED: ${ADDRESS_FILTER_ENABLED}
      ADDRESS_FILTER_FILE: ${ADDRESS_FILTER_FILE}
    volumes:
      - ./${ADDRESS_FILTER_FILE}:/eth-storage/${ADDRESS_FILTER_FILE}:ro
    depends_on:
      db:
        condition: service_healthy
      publicnode:
        condition: service_healthy
